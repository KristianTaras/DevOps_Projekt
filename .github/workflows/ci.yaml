name: CI/CD Build and Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-scan:
    name: Build and Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [api, frontend, worker]

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker build -t ticketing-${{ matrix.service }}:latest ./${{ matrix.service }} -f ./${{ matrix.service }}/Containerfile

      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ticketing-${{ matrix.service }}:latest
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

      - name: Login to Quay.io
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.QUAY_PASSWORD }}" | docker login quay.io -u "${{ secrets.QUAY_USERNAME }}" --password-stdin

      - name: Push to Quay.io
        if: github.event_name != 'pull_request'
        run: |
          docker tag ticketing-${{ matrix.service }}:latest quay.io/${{ secrets.QUAY_USERNAME }}/ticketing-${{ matrix.service }}:latest
          docker push quay.io/${{ secrets.QUAY_USERNAME }}/ticketing-${{ matrix.service }}:latest
